name: V1 Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run V1 tests
        run: python -m unittest discover -s tests -v

      - name: Smoke test CLI
        run: printf 'Create a workflow that receives a form submission, analyzes it with AI, and sends the result to Gmail.\n' | python main.py
