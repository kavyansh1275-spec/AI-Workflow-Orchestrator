name: Provider Smoke Tests

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Provider to test
        required: true
        default: all
        type: choice
        options:
          - all
          - n8n
          - make
          - zapier

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    env:
      N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
      N8N_BASE_URL: ${{ secrets.N8N_BASE_URL }}
      MAKE_API_TOKEN: ${{ secrets.MAKE_API_TOKEN }}
      MAKE_BASE_URL: ${{ secrets.MAKE_BASE_URL }}
      MAKE_TEAM_ID: ${{ secrets.MAKE_TEAM_ID }}
      ZAPIER_API_TOKEN: ${{ secrets.ZAPIER_API_TOKEN }}
      ZAPIER_BASE_URL: ${{ secrets.ZAPIER_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run provider smoke test
        env:
          SELECTED_PROVIDER: ${{ inputs.provider }}
        run: |
          python - <<'PY'
          import os
          from core.provider_smoke import ProviderSmokeTester

          selected = os.environ["SELECTED_PROVIDER"]
          tester = ProviderSmokeTester()
          if selected == "all":
              result = tester.run_all()
          else:
              result = {selected: tester.run(selected).model_dump(mode="json")}
          print(result)
          PY
