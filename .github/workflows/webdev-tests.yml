name: Web Developer Tests
on:
  push:
    branches: ["web-developer-v1"]
  pull_request:
    branches: ["main"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt -r requirements-webdev.txt
      - run: python -m unittest tests.test_webdev_engine -v
